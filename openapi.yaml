openapi: 3.0.4
info:
  title: World Time
  description: >-
    World Time looks up the current local time, date, and timezone for any city,
    or for any latitude and longitude. Search by city name to get matching
    locations with country codes, IANA timezone identifiers, UTC offsets, and
    formatted times in 12-hour, 24-hour, and ISO 8601 formats.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/worldtime:
    get:
      summary: World Time
      description: Get the current time in any city
      operationId: worldtime
      parameters:
        - name: city
          in: query
          schema:
            type: string
          required: true
          description: >-
            The city name for which you want to get the current time (e.g., New
            York)
          example: San Francisco
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  search: San Francisco
                  foundCities:
                    - city: San Francisco
                      city_ascii: San Francisco
                      country: Argentina
                      iso2: AR
                      iso3: ARG
                      province: Córdoba
                      timezone: America/Argentina/Cordoba
                      time: '17:51'
                      time24: '17:51:13'
                      time12: 05:51:13 PM
                      date: '2026-10-26'
                      day: Monday
                      month: October
                      year: '2026'
                      unix: '1793047873'
                      dst: false
                      dst_start: null
                      dst_end: null
                      dst_name: '-03'
                      utc_offset: '-03:00'
                      datetime: '2026-10-26T17:51:13-03:00'
                      utc_datetime: '2026-10-26T20:51:13Z'
                      day_of_year: 299
                      week_number: 44
                    - city: San Francisco
                      city_ascii: San Francisco
                      country: United States of America
                      iso2: US
                      iso3: USA
                      province: California
                      state_ansi: CA
                      timezone: America/Los_Angeles
                      time: '13:51'
                      time24: '13:51:13'
                      time12: 01:51:13 PM
                      date: '2026-10-26'
                      day: Monday
                      month: October
                      year: '2026'
                      unix: '1793047873'
                      dst: true
                      dst_start: '2026-03-08 03:00:00'
                      dst_end: '2026-11-01 01:00:00'
                      dst_name: PDT
                      utc_offset: '-07:00'
                      datetime: '2026-10-26T13:51:13-07:00'
                      utc_datetime: '2026-10-26T20:51:13Z'
                      day_of_year: 299
                      week_number: 44
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
